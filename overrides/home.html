{% extends "main.html" %}
{% block tabs %}
  {{ super() }}
  <style>
  .md-header{position:initial}
  .md-main__inner{margin:0}
  .md-content{display:none}
  .md-sidebar--secondary{display:none}
  .md-sidebar--primary{display:none}
</style>
  <section class="mdx-container">
    <div class="md-grid md-typeset">
      <div class="mdx-hero">
        <div class="mdx-hero__image">
          <!-- Path is relative to the docs/ root. Swap for your own artwork any time. -->
          <img src="assets/images/hero-illustration.svg" alt="" width="680" height="680" draggable="false">
        </div>
        <div class="mdx-hero__content">
          <!-- Your headline -->
          <h1>Afridyne Systems</h1>
          <!-- Your subheading. This pulls from mkdocs.yml's site_description by default -->
          <p>{{ config.site_description }}</p>
          <!-- Buttons: change the href targets to real pages in your nav -->
          <a href="{{ 'MkDocs-Material-Start/' | url }}" title="Get started" class="md-button md-button--primary">
            Get started
          </a>
          <a href="{{ 'about/' | url }}" title="Learn more" class="md-button">
            Learn more
          </a>
        </div>
      </div>
    </div>
  </section>
{% endblock %}
{% block content %}{% endblock %}
{% block footer %}{% endblock %}
