<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Abstract illustration of a core node with three orbital rings</title>
<desc>A central hexagonal node surrounded by three tilted elliptical orbit rings, each carrying a small satellite point, set against a scattering of faint stars.</desc>
<style>
.core{fill:#2b6cb0}
.core-line{stroke:#1a365d;stroke-width:1}
.orbit{fill:none;stroke-width:1.2}
.orbit-a{stroke:#38b2ac}
.orbit-b{stroke:#d69e2e}
.orbit-c{stroke:#c05780}
.sat-a{fill:#38b2ac}
.sat-b{fill:#d69e2e}
.sat-c{fill:#c05780}
.star{fill:#a0aec0}
@media (prefers-color-scheme: dark) {
.core{fill:#63b3ed}
.core-line{stroke:#90cdf4}
.orbit-a{stroke:#4fd1c5}
.orbit-b{stroke:#f6ad55}
.orbit-c{stroke:#f687b3}
.sat-a{fill:#4fd1c5}
.sat-b{fill:#f6ad55}
.sat-c{fill:#f687b3}
.star{fill:#4a5568}
}
</style>
<g class="star">
<circle cx="80" cy="90" r="2"/><circle cx="140" cy="200" r="1.5"/><circle cx="60" cy="340" r="2"/>
<circle cx="110" cy="480" r="1.5"/><circle cx="180" cy="580" r="2"/><circle cx="580" cy="110" r="2"/>
<circle cx="610" cy="230" r="1.5"/><circle cx="560" cy="400" r="2"/><circle cx="600" cy="530" r="1.5"/>
<circle cx="520" cy="600" r="2"/><circle cx="330" cy="60" r="1.5"/><circle cx="360" cy="620" r="1.5"/>
</g>
<g transform="translate(340,340)">
<ellipse class="orbit orbit-a" rx="220" ry="95" transform="rotate(-20)"/>
<ellipse class="orbit orbit-b" rx="220" ry="95" transform="rotate(40)"/>
<ellipse class="orbit orbit-c" rx="220" ry="95" transform="rotate(100)"/>
<circle class="sat-a" r="7" transform="rotate(-20) translate(220,0)"/>
<circle class="sat-b" r="7" transform="rotate(40) translate(-220,0)"/>
<circle class="sat-c" r="7" transform="rotate(100) translate(150,60)"/>
<polygon class="core core-line" points="0,-55 48,-27 48,27 0,55 -48,27 -48,-27"/>
</g>
</svg>
